# ---- existence: instances -----------------------------------------------------------------
# A write names a WORD (`term`), never a graph and never a category id.

mutation AssertEntityExists($input: AssertEntityExistsInput!) {
  assertEntityExists(input: $input) { ...AssertedEntity }
}

mutation AssertNaturalEventExists($input: AssertNaturalEventExistsInput!) {
  assertNaturalEventExists(input: $input) { ...AssertedNaturalEvent }
}

mutation AssertProtocolEventExists($input: AssertProtocolEventExistsInput!) {
  assertProtocolEventExists(input: $input) { ...AssertedProtocolEvent }
}

# One assertion over many (node, term) pairs — a batch is one act.
mutation ClassifyNodes($input: ClassifyNodesInput!) {
  classifyNodes(input: $input) { ...AssertedInstances }
}

mutation AssertSameInstance($input: AssertSameInstanceInput!) {
  assertSameInstance(input: $input) { ...AssertedSameness }
}

# ---- structures and metrics ---------------------------------------------------------------

mutation AssertStructureExists($input: AssertStructureExistsInput!) {
  assertStructureExists(input: $input) { ...AssertedStructure }
}

mutation AssertMetricValue($input: AssertMetricValueInput!) {
  assertMetricValue(input: $input) { ...AssertedMetric }
}

# Many values about any number of data, as one act. A metric that names a uuid already on the
# record is reported, not recorded again; a batch of only those has no assertion.
mutation AssertMetricValues($input: AssertMetricValuesInput!) {
  assertMetricValues(input: $input) { ...AssertedMetricValues }
}

# Retracting Standing + the new Metric under ONE assertion. Returns a metric with a NEW id.
mutation SupersedeMetricValue($input: SupersedeMetricValueInput!) {
  supersedeMetricValue(input: $input) { ...AssertedMetric }
}

# ---- links ---------------------------------------------------------------------------------

mutation AssertRelationExists($input: AssertRelationExistsInput!) {
  assertRelationExists(input: $input) { ...AssertedRelation }
}

mutation AssertMeasurementExists($input: AssertMeasurementExistsInput!) {
  assertMeasurementExists(input: $input) { ...AssertedMeasurement }
}

mutation AssertStructureRelationExists($input: AssertStructureRelationExistsInput!) {
  assertStructureRelationExists(input: $input) { ...AssertedStructureRelation }
}

mutation AssertParticipation($input: AssertParticipationInput!) {
  assertParticipation(input: $input) { ...AssertedParticipation }
}

# Many participants in one event, one assertion.
mutation AssertParticipations($input: AssertParticipationsInput!) {
  assertParticipations(input: $input) { ...AssertedLinks }
}

# ---- comments ------------------------------------------------------------------------------

mutation CommentOnStructure($input: CommentOnStructureInput!) {
  commentOnStructure(input: $input) { ...AssertedComment }
}
