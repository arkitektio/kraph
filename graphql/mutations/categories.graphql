# A Category is one view's rule for a word: what it means HERE, how it is drawn, and which
# properties are derived onto it. Creating one never records a claim.

mutation CreateEntityCategory($input: CreateEntityCategoryInput!) {
  createEntityCategory(input: $input) { ...EntityCategory }
}
mutation UpdateEntityCategory($input: UpdateEntityCategoryInput!) {
  updateEntityCategory(input: $input) { ...EntityCategory }
}
mutation DeleteEntityCategory($input: DeleteEntityCategoryInput!) {
  deleteEntityCategory(input: $input)
}

